<!DOCTYPE html>
<html lang="es">
  <head>
    <title>Saludador</title>
  </head>
  <body>
    <h1>Saludador</h1>

    <label>Idioma:</label>
    <select id="idioma">
      <option value="ES">Español</option>
      <option value="EN">English</option>
    </select>

    <br><br>

    <label>Nombre:</label>
    <input type="text" id="nombre">

    <br><br>

    <label>Género (M/F):</label>
    <input type="text" id="genero">

    <br><br>

    <label>Edad:</label>
    <input type="number" id="edad">

    <br><br>

    <button id="saludar-button">Saludar</button>

    <p id="saludo"></p>

    <script type="module" src="./src/presenter.js"></script>
  </body>
</html>
